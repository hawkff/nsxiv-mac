name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: .build/release/nsxiv-mac -v
      - name: Regression checks
        run: |
          sources=()
          for source in Sources/nsxiv-mac/*.swift; do
            if [[ "$source" != */main.swift ]]; then sources+=("$source"); fi
          done
          swiftc -parse-as-library "${sources[@]}" Tests/RegressionChecks.swift -o "$RUNNER_TEMP/nsxiv-regressions"
          "$RUNNER_TEMP/nsxiv-regressions"
      - name: Package
        run: tar -czf nsxiv-mac.tar.gz -C .build/release nsxiv-mac
      - uses: actions/upload-artifact@v4
        with:
          name: nsxiv-mac
          path: nsxiv-mac.tar.gz

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4-trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install X11, Wayland and Imlib2
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libx11-dev libimlib2-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev pkg-config xvfb xauth xdotool imagemagick fonts-dejavu-core \
            sway grim wtype jq weston mutter dbus-daemon labwc
      - name: Build
        run: swift build -c release --static-swift-stdlib
      - name: Smoke test
        run: .build/release/nsxiv-mac -v
      - name: Regression checks
        run: |
          sources=()
          for source in Sources/nsxiv-mac/*.swift; do
            # the Wayland frontend needs the CWayland C target, which only SwiftPM builds
            if [[ "$source" != */main.swift && "$source" != */WaylandUI.swift ]]; then sources+=("$source"); fi
          done
          flags=()
          for flag in $(pkg-config --cflags x11 imlib2 fontconfig); do flags+=(-Xcc "$flag"); done
          swiftc -parse-as-library -I Sources/CX11 "${flags[@]}" "${sources[@]}" Tests/RegressionChecks.swift \
            -o "$RUNNER_TEMP/nsxiv-regressions"
          "$RUNNER_TEMP/nsxiv-regressions"
      - name: Run under X
        run: xvfb-run -a -s "-screen 0 1280x800x24" sh Tests/x11-smoke.sh .build/release/nsxiv-mac shots
      - name: Run under Wayland
        run: sh Tests/wayland-smoke.sh .build/release/nsxiv-mac wayland-shots
      - name: Run under Weston, which leaves decorations to the window
        run: sh Tests/weston-smoke.sh .build/release/nsxiv-mac weston-shots
      - name: Run under labwc, where a growing window must stay on screen
        run: |
          sh Tests/stacking-smoke.sh .build/release/nsxiv-mac labwc stacking-shots 1
          sh Tests/stacking-smoke.sh .build/release/nsxiv-mac labwc stacking-shots 2
      - name: Run under mutter, where a growing window must stay on screen
        run: |
          dbus-run-session -- sh Tests/mutter-smoke.sh .build/release/nsxiv-mac 1
          dbus-run-session -- sh Tests/mutter-smoke.sh .build/release/nsxiv-mac 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots
            wayland-shots
            weston-shots
            stacking-shots
      - name: Package
        run: tar -czf nsxiv-mac-linux.tar.gz -C .build/release nsxiv-mac
      - uses: actions/upload-artifact@v4
        with:
          name: nsxiv-mac-linux
          path: nsxiv-mac-linux.tar.gz

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift, X11, Wayland, Imlib2 and niri
        run: |
          pacman -Syu --noconfirm --needed base-devel libx11 imlib2 fontconfig wayland libxkbcommon \
            libxml2-legacy ncurses sqlite ttf-dejavu sway niri grim wtype imagemagick mesa kwin wayfire \
            jq river-classic cosmic-comp
          useradd -m tester # Wayfire refuses to run as root
          # the toolchain the AUR's swift-bin repackages, with ncurses under its Arch name; the
          # hash is of the tarball the Swift 6.x release key signed
          tarball=swift-6.4.1-RELEASE-ubi10.tar.gz
          curl -fsSLo "/tmp/$tarball" "https://download.swift.org/swift-6.4.1-release/ubi10/swift-6.4.1-RELEASE/$tarball"
          echo "180ca7843cd092f2bcce230ab59c3b025159a41e81696e6543f349405f34d321  /tmp/$tarball" | sha256sum -c -
          tar -xzf "/tmp/$tarball" -C /opt
          rm "/tmp/$tarball"
          ln -sf /usr/lib/libncursesw.so.6 /usr/lib/libncurses.so.6
          echo /opt/swift-6.4.1-RELEASE-ubi10/usr/bin >> "$GITHUB_PATH"
          # copies without the file capabilities a container cannot grant
          for compositor in sway niri kwin_wayland river cosmic-comp; do
            install -m755 "/usr/bin/$compositor" "/usr/local/bin/$compositor"
          done
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: .build/release/nsxiv-mac -v
      - name: Run under niri
        run: sh Tests/niri-smoke.sh .build/release/nsxiv-mac niri-shots
      - name: Run under KWin, where a growing window must stay on screen
        run: |
          dbus-run-session -- sh Tests/kwin-smoke.sh .build/release/nsxiv-mac 1
          dbus-run-session -- sh Tests/kwin-smoke.sh .build/release/nsxiv-mac 2
      - name: Run under Wayfire, where a growing window must stay on screen
        run: |
          mkdir -p stacking-shots && chmod 777 stacking-shots
          runuser -u tester -- sh Tests/stacking-smoke.sh .build/release/nsxiv-mac wayfire stacking-shots
      - name: Run under river, where a growing window must stay on screen
        run: sh Tests/stacking-smoke.sh .build/release/nsxiv-mac river stacking-shots
      - name: Run as a floating niri window, which must stay on screen as it grows
        run: sh Tests/niri-floating-smoke.sh .build/release/nsxiv-mac
      - name: Run under COSMIC, where a growing window must stay on screen
        run: dbus-run-session -- sh Tests/cosmic-smoke.sh .build/release/nsxiv-mac cosmic-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niri-screenshots
          path: |
            niri-shots
            stacking-shots
            cosmic-shots

  hyprland:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nsxiv-mac-linux
      # Hyprland needs a display device; vkms is a virtual one, drawn by software
      - name: Load a virtual display
        run: |
          sudo modprobe vkms || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vkms; }
          ls -l /dev/dri
      - name: Run under Hyprland, where a growing window must stay on screen
        run: |
          tar -xzf nsxiv-mac-linux.tar.gz
          docker run --rm --privileged -v "$PWD:/w" -w /w archlinux:latest bash -c '
            pacman -Syu --noconfirm --needed hyprland mesa imlib2 fontconfig libx11 libxkbcommon wayland \
              ttf-dejavu imagemagick jq >/dev/null
            sh Tests/hyprland-smoke.sh ./nsxiv-mac'

  plasma5:
    runs-on: ubuntu-24.04
    container: swift:6.4-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Wayland, Imlib2 and KWin 5.27
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libx11-dev libimlib2-dev libfontconfig-dev \
            libwayland-dev libxkbcommon-dev pkg-config imagemagick fonts-dejavu-core kwin-wayland \
            dbus-daemon dbus-bin
          # a copy without the file capabilities a container cannot grant
          install -m755 /usr/bin/kwin_wayland /usr/local/bin/kwin_wayland
      - name: Build
        run: swift build -c release --static-swift-stdlib
      - name: Run under KWin 5.27, where a growing window must stay on screen
        run: |
          dbus-run-session -- sh Tests/kwin-smoke.sh .build/release/nsxiv-mac 1
          dbus-run-session -- sh Tests/kwin-smoke.sh .build/release/nsxiv-mac 2
