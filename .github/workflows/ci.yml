name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: nscloud-macos-sequoia-arm64-6x14
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version with the commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sed -i '' "s/appVersion = \"\([^\"]*\)\"/appVersion = \"\1+${SHA:0:7}\"/" Sources/nsxiv-mac/Config.swift
          grep -q "+${SHA:0:7}" Sources/nsxiv-mac/Config.swift
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: .build/release/nsxiv-mac -v
      - name: Package
        run: tar -czf nsxiv-mac.tar.gz -C .build/release nsxiv-mac
      - uses: actions/upload-artifact@v4
        with:
          name: nsxiv-mac
          path: nsxiv-mac.tar.gz
